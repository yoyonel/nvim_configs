name: CI Neovim Config
on: [push, pull_request]

jobs:
  validate:
    name: Qualité & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Just & Stylua
        uses: taiki-e/install-action@v2
        with:
          tool: just,stylua

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Validation (Scripts/Validate)
        run: just validate

      - name: Linting (Lua, Just, Markdown, JSON, YAML)
        run: just lint
