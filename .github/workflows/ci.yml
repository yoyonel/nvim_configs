name: CI Neovim Config
on: [push, pull_request]

jobs:
  validate:
    name: Validation de la config Neovim
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Vérification du démarrage (Headless)
        run: |
          chmod +x ./scripts/validate.sh
          ./scripts/validate.sh
